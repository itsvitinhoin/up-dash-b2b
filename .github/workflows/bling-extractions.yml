name: Bling ERP extraction
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bling-erp-extraction
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Import Bling in resumable batches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          # Pausas curtas de cota (docs/integracao-bling-jini.md): esperar o
          # retryAt e tentar o mesmo cliente de novo em vez de encerrar a run.
          # So interrompe de verdade em cota diaria, espera > 15min ou erro permanente.
          offset=0
          failed=0
          for batch in $(seq 1 1000); do
            response_file="$(mktemp)"
            status=$(curl --silent --show-error --max-time 65 --output "$response_file" --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Repository: ${GH_REPOSITORY}" \
              "https://www.grupoup-dash.com.br/api/cron/extractions/bling?offset=${offset}")
            node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if(!p.result || !Number.isInteger(p.result.clients) || !Number.isInteger(p.result.nextOffset)) process.exit(1);' "$response_file"
            cat "$response_file"
            code=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.code ?? "")' "$response_file")
            period=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.rateLimitPeriod ?? "")' "$response_file")
            retry_at=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.retryAt ?? "")' "$response_file")
            processed=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.clients)' "$response_file")
            next_offset=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.nextOffset)' "$response_file")
            rm -f "$response_file"
            if [ "$code" = "BLING_RATE_LIMIT" ] && [ "$period" != "day" ] && [ -n "$retry_at" ]; then
              wait_seconds=$(node -e 'console.log(Math.max(0, Math.ceil((new Date(process.argv[1]).getTime() - Date.now()) / 1000)))' "$retry_at")
              if [ "$wait_seconds" -le 900 ]; then
                echo "Pausa curta de cota do Bling (${wait_seconds}s). Aguardando e tentando de novo no offset=${offset}."
                sleep "$wait_seconds"
                continue
              fi
            fi
            offset="$next_offset"
            if [ "$status" -ge 400 ]; then failed=$((failed + 1)); fi
            if [ "$processed" = 0 ]; then break; fi
            sleep 1
          done
          if [ "$failed" -gt 0 ]; then exit 1; fi
