name: Scheduled data extractions

# Cron desativado em 17/08/2026: essas 3 extracoes (hourly, upzero-transactional,
# nuvemshop-transactional) migraram pros Cloud Run Jobs no GCP (projeto
# up-vesti-report, regiao us-central1), rodando perto do Cloud SQL em vez de
# pagar a latencia de regiao da Vercel (gru1 -> us-central1, ~360ms/query).
# Ver artifacts/api-server/Dockerfile.job e cloudbuild.job.yaml.
# workflow_dispatch continua disponivel pra rodar manualmente se precisar.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Extração a executar
        type: choice
        default: all
        options: [all, bling]
      bling_client_id:
        description: ID da marca Bling (obrigatório no modo bling)
        type: string
        required: false
      bling_orders_only:
        description: Atualizar somente pedidos alterados do período já importado
        type: boolean
        default: false

jobs:
  braavo-transactional:
    name: Braavo B2C transactional extraction
    if: inputs.mode != 'bling' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: braavo-transactional
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Continue Braavo imports in durable batches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          offset=0
          total_failed=0
          while true; do
            response_file="$(mktemp)"
            status_code=$(curl --show-error --silent --max-time 65 --output "$response_file" --write-out "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Repository: ${GH_REPOSITORY}" \
              -H "X-GitHub-Run-Id: ${GH_RUN_ID}" \
              "https://www.grupoup-dash.com.br/api/cron/extractions/braavo?offset=${offset}")
            node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!p.result || !Number.isInteger(p.result.clients) || !Number.isInteger(p.result.nextOffset)) process.exit(1);' "$response_file"
            cat "$response_file"
            processed=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.clients)' "$response_file")
            next_offset=$(node -e 'const p=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); console.log(p.result.nextOffset)' "$response_file")
            if [ "$status_code" -ge 400 ]; then
              total_failed=$((total_failed + 1))
              offset=$((offset + 1))
            else
              offset="$next_offset"
            fi
            rm -f "$response_file"
            if [ "$processed" = "0" ]; then break; fi
            sleep 1
          done
          if [ "$total_failed" -gt 0 ]; then exit 1; fi

  hourly:
    name: Hourly analytics and Meta extraction
    if: inputs.mode != 'bling' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run hourly extraction
        run: |
          response=$(curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Repository: ${{ github.repository }}" \
            -H "X-GitHub-Run-Id: ${{ github.run_id }}" \
            "https://www.grupoup-dash.com.br/api/cron/extractions/hourly")
          echo "$response"
          node -e "const payload = JSON.parse(process.argv[1]); const hasFailed = (value) => value && typeof value === 'object' && ((typeof value.failed === 'number' && value.failed > 0) || Object.values(value).some(hasFailed)); if (!payload.ok || hasFailed(payload.result)) { console.error('Extraction returned failed clients'); process.exit(1); }" "$response"

  upzero-transactional:
    name: Twice daily UP Zero transactional extraction
    if: inputs.mode != 'bling' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3,15 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run UP Zero transactional extraction
        run: |
          response=$(curl --fail-with-body --show-error --silent \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Repository: ${{ github.repository }}" \
            -H "X-GitHub-Run-Id: ${{ github.run_id }}" \
            "https://www.grupoup-dash.com.br/api/cron/extractions/upzero-transactional")
          echo "$response"
          node -e "const payload = JSON.parse(process.argv[1]); const failed = Number(payload.result?.failed ?? 0); if (!payload.ok || failed > 0) { console.error('UP Zero extraction returned failed clients'); process.exit(1); }" "$response"

  nuvemshop-transactional:
    name: Twice daily Nuvemshop transactional extraction
    if: inputs.mode != 'bling' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 3,15 * * *')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Run Nuvemshop transactional extraction
        run: |
          offset=0
          total_failed=0
          while true; do
            response_file="$(mktemp)"
            status_code=$(curl --show-error --silent --output "$response_file" --write-out "%{http_code}" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Repository: ${{ github.repository }}" \
              -H "X-GitHub-Run-Id: ${{ github.run_id }}" \
              "https://www.grupoup-dash.com.br/api/cron/extractions/nuvemshop?limit=1&offset=${offset}&lookbackDays=7&skipCatalog=true&allowPartial=true")
            response="$(cat "$response_file")"
            rm -f "$response_file"
            echo "$response"

            processed=$(node -e "try { const payload = JSON.parse(process.argv[1]); console.log(payload.result?.clients ?? 0); } catch { console.log(1); }" "$response")
            failed=$(node -e "try { const payload = JSON.parse(process.argv[1]); console.log(Number(payload.result?.failed ?? 0)); } catch { console.log(1); }" "$response")
            if [ "$status_code" -ge 400 ] || [ "$failed" -gt 0 ]; then
              echo "Nuvemshop extraction offset ${offset} returned status ${status_code} with ${failed} failed client(s)."
              if [ "$failed" -gt 0 ]; then
                total_failed=$((total_failed + failed))
              else
                total_failed=$((total_failed + 1))
              fi
            fi
            if [ "$processed" = "0" ]; then
              break
            fi
            offset=$((offset + 1))
          done
          if [ "$total_failed" -gt 0 ]; then
            echo "Nuvemshop extraction completed with ${total_failed} failed client(s)."
            exit 1
          fi

  bling-import:
    name: Complete one authorized Bling import
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bling'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: bling-import-${{ inputs.bling_client_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Resume the selected brand until complete
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          DASH_CLIENT_ID: ${{ inputs.bling_client_id }}
          BLING_ORDERS_ONLY: ${{ inputs.bling_orders_only }}
        run: |
          node --input-type=module <<'JS'
          import { setTimeout as wait } from 'node:timers/promises';
          const clientId = process.env.DASH_CLIENT_ID;
          if (!clientId || !/^[a-zA-Z0-9_-]{1,200}$/.test(clientId)) throw new Error('A brand ID is required.');
          const url = new URL('https://www.grupoup-dash.com.br/api/cron/extractions/bling');
          url.searchParams.set('clientId', clientId);
          if (process.env.BLING_ORDERS_ONLY === 'true') url.searchParams.set('ordersOnly', 'true');
          const deadline = Date.now() + 350 * 60_000;
          let previousCheckpoint = '', failures = 0, lastNotice = 0;
          console.log('Starting the authorized ERP import.');
          while (Date.now() < deadline) {
            let response, body;
            try {
              response = await fetch(url, { redirect: 'error', signal: AbortSignal.timeout(70_000), headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Repository': process.env.GH_REPOSITORY,
                'X-GitHub-Run-Id': process.env.GH_RUN_ID,
              }});
              body = await response.json();
            } catch {
              if (response && [400, 401, 403, 404].includes(response.status)) throw new Error('Import authorization or target is invalid.');
              failures++;
              if (failures > 12) throw new Error('Import stopped after repeated transport failures.');
              console.log('Temporary import request failure; retrying.', { httpStatus: response?.status ?? null });
              await wait(Math.min(300_000, 30_000 * failures));
              continue;
            }
            if ([401, 403, 400].includes(response.status)) throw new Error('Import authorization or target is invalid.');
            const result = body?.result;
            if (!result || !Number.isInteger(result.clients)) {
              if (response.status >= 500) {
                failures++;
                if (failures > 12) throw new Error('Import stopped after repeated backend unavailability; the checkpoint is preserved.');
                if (Date.now() - lastNotice > 300_000) { console.log('Backend temporarily unavailable; the import will retry from its saved checkpoint.'); lastNotice = Date.now(); }
                await wait(Math.min(300_000, 30_000 * failures));
                continue;
              }
              throw new Error('Unexpected import response.');
            }
            if (result.clients !== 1) throw new Error('The selected brand has no active authorized Bling connection.');
            if (response.ok && result.complete === true) { console.log('Import completed successfully.'); process.exit(0); }
            if (response.ok && result.failed === 0) {
              failures = 0;
              previousCheckpoint = '';
              await wait(1000);
              continue;
            }
            if (['BLING_AUTH_FAILED', 'BLING_SCOPE_REQUIRED', 'BLING_NOT_CONNECTED', 'BLING_COMPANY_MISMATCH', 'BLING_NOT_SELECTED', 'BLING_HISTORY_REQUIRED'].includes(result.code)) throw new Error('Import stopped: account authorization or configuration needs attention.');
            if (result.rateLimitPeriod === 'day') throw new Error('Import paused: the provider daily quota is exhausted.');
            const checkpoint = JSON.stringify(result.checkpoint);
            failures = checkpoint !== previousCheckpoint ? 0 : failures + 1;
            previousCheckpoint = checkpoint;
            if (failures > (result.code === 'BLING_RATE_LIMIT' ? 60 : 12)) throw new Error('Import stopped after repeated failures without progress.');
            const retryAt = Date.parse(result.retryAt ?? '');
            const quota = result.code === 'BLING_RATE_LIMIT';
            const delay = quota
              ? Math.max(2000, Number.isFinite(retryAt) ? retryAt - Date.now() : 10_000, Math.min(30_000, failures * 2000))
              : Math.max(30_000, Math.min(300_000, failures * 30_000));
            if (delay > 15 * 60_000) throw new Error('Import paused: the provider requires a longer cooldown.');
            if (Date.now() - lastNotice > 300_000) {
              console.log(quota ? 'Provider cooldown; progress is preserved and the import will resume.' : result.code === 'BLING_BUSY' ? 'Brand import is in use; waiting to resume its checkpoint.' : 'Backend batch failed; retrying the saved checkpoint.');
              lastNotice = Date.now();
            }
            await wait(delay + Math.floor(Math.random() * 2000));
          }
          throw new Error('Import time window ended before completion; the checkpoint is preserved.');
          JS
